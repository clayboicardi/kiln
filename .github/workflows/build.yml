name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests on Ubuntu (data:library + audio:playback)
        run: ./gradlew :data:library:desktopTest :audio:playback:desktopTest

      - name: Build APK
        run: ./gradlew :app-android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiln-app-android-debug
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop tests
        run: ./gradlew :data:library:desktopTest :audio:playback:desktopTest

      - name: Build Desktop JAR
        run: ./gradlew :app-desktop:assemble

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-desktop-test-reports
          path: |
            data/library/build/reports/tests/desktopTest/**
            audio/playback/build/reports/tests/desktopTest/**
          if-no-files-found: ignore

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: kiln-app-desktop
          path: app-desktop/build/libs/*.jar
          if-no-files-found: error
