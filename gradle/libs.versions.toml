[versions]
# === Language / build core (verified 2026-05-19 via gh api releases) ===
kotlin = "2.3.21"                       # latest stable; 2.4.0 still RC as of 2026-05-13
kotlinx-coroutines = "1.11.0"           # latest stable 2026-05-08
kotlinx-serialization = "1.9.0"         # matches Slack circuit pin (1.11.0 stable exists but Slack hasn't bumped; safer to track Slack)
agp = "9.2.1"                           # matches Slack circuit
ksp = "2.3.8"                           # latest stable 2026-05-13; aligned with Kotlin 2.3.21
android-compileSdk = "36"               # spec §2 hard lock
android-minSdk = "23"                   # spec §2 hard lock; bumped 21→23 on 2026-05-19 (Compose-MP 1.11 components-resources requires ≥23; vetting log Item 1 addendum)
android-targetSdk = "36"
jvmTarget = "21"                        # CLAUDE.md JDK 21 (Temurin verified 2026-05-19)

# === Compose Multiplatform (Item 1 — verified 2026-05-19) ===
jb-compose = "1.11.0"                   # latest stable 2026-05-13; matches Slack
jb-compose-material3 = "1.9.0"          # matches Slack
jb-compose-material-icons-core = "1.7.3"
compose-runtime = "1.11.1"              # keep in sync with the androidx version used by jb-compose
jb-lifecycle = "2.11.0-beta01"          # KMP lifecycle artifacts; matches Slack circuit
skiko = "0.144.6"                       # explicit pin matching Compose-MP 1.11.0's transitive force-upgrade; silences the coil 3.4.0 declared-version mismatch warning per review P2-1. When Compose-MP bumps, verify via :ui:theme:dependencies and re-pin.

# === Image loading (Item 2 — Pre-MVP locked) ===
coil = "3.4.0"

# === Palette / Dynamic theming (Item 3 — Pre-MVP locked; revisit at Phase 2a Flight A) ===
kmpalette = "4.0.0-beta02"

# === Navigation (Item 4 — Pre-MVP confirmed; beta line, hasn't moved in ~9 months) ===
voyager = "1.1.0-beta03"

# === Presenter / state (Item 5 — Pre-MVP locked; finalize at MVP Session 12-15) ===
circuit = "0.33.1"
molecule = "2.2.0"

# === Data layer (Item 6 — Pre-MVP locked) ===
sqldelight = "2.3.2"
# Bundled SQLite for Android — vendor's system SQLite on Pixel 10 / Android 16
# was missing the FTS5 module (Session 10 H8 discovery). Bundling guarantees
# FTS5 + a known-version SQLite across device variance. ~3 MB APK cost.
# 3.49.0 stable as of 2025-05-29.
requery-sqlite-android = "3.49.0"

# === DI ===
kotlinInject = "0.9.0"                  # matches Slack circuit

# === Functional / showcase ===
arrow = "2.2.2.1"                       # latest stable 2026-03-18; :audio:dsp Arrow Either showcase per spec

# === Testing ===
kotest = "6.1.11"                       # latest stable 2026-04-04; major bump from prep-doc-listed 5.9.1
turbine = "1.2.1"                       # matches Slack circuit (Flow testing)
mokkery = "3.3.0"                       # latest stable 2026-03-18; KMP-friendly mocking
roborazzi = "1.61.0"                    # Pre-MVP-pinned; one tick newer than Slack's 1.60.0

# === Audio (Item 9 — Pre-MVP locked) ===
jna = "5.17.0"                          # JVM ↔ libFLAC bridge; bumped from 5.14.0 (2023-12) to 5.17.0 (2025-03-16) per review P1-4. Verified parity via FlacDecodeSmokeTest.
# Native libFLAC 1.5.0 vendored under :audio:playback/src/jvmMain/resources/native/win-x64/ (lands at MVP Session 4-7)

# === Android Media3 (Item 11 + Item 13 PlatformPlayer Android adapter) ===
androidx-media3 = "1.10.1"              # latest stable 2026-05-12 (prep doc had hallucinated 1.10.6)

# === Android Activity (for :app-android setContent integration) ===
androidx-activity = "1.13.0"            # matches Slack circuit

# === Tag reader (desktop FLAC metadata) ===
jaudiotagger = "3.0.1"                  # net.jthink:jaudiotagger; verify via Maven Central at first build

# === Logging ===
kermit = "2.1.0"                        # latest stable 2026-03-02

# === Android host-side testing (Robolectric on JVM, no device required) ===
# Aligned to Slack circuit's 4.16.1 (Phase 5 androidHostTest wiring).
robolectric = "4.16.1"
# androidx.test:core supplies ApplicationProvider — Robolectric strongly
# recommends declaring this explicitly (per robolectric.org/androidx_test/).
androidx-test-core = "1.7.0"
# JUnit 4 — required for :app-android testImplementation (legacy
# com.android.application plugin doesn't pull JUnit transitively even
# via Robolectric, unlike the AGP 9 KMP androidHostTest source set).
# Matches Slack circuit's pin.
junit4 = "4.13.2"

# === Utility ===
appdirs = "1.5.0"                       # Slack-aligned; Desktop user-data-dir resolution

[libraries]
# === Kotlin core ===
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
