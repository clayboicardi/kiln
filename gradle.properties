# JVM toolchain — pin to Temurin 21 already on PATH (CLAUDE.md "NOT JBR" rule).
# Disable auto-download to keep the toolchain pinned to what's installed.
org.gradle.java.installations.auto-download=false

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Metaspace bumped 512m → 1g on 2026-05-21 — Session 10 H8 surfaced
# "KspAAWorkerAction Metaspace" OOM during :app-android KSP with the
# Fix J bundled-SQLite change increasing classpath size.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.daemon.useFallbackStrategy=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
